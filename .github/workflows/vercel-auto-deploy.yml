name: Vercel auto-deploy (main)

# Cada push a main dispara el Deploy Hook de Vercel.
#
# DEBOUNCE / CONCURRENCY:
# - Si llegan varios pushes seguidos en pocos segundos, solo el ultimo
#   sobrevive (concurrency.cancel-in-progress cancela los previos).
# - Esperamos 30s antes de disparar el hook para dar tiempo a que se
#   acumulen pushes rapidos. Asi Vercel siempre recibe UN trigger del
#   commit mas reciente, en vez de N triggers que se pisan entre si.
# - Sin este debounce, Vercel descarta los triggers que llegan mientras
#   esta construyendo el anterior (limitacion de Hobby).
#
# Si necesitas un deploy inmediato sin esperar el debounce, dispara
# manualmente con: workflow_dispatch desde la pestana Actions de GitHub.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-deploy-main
  cancel-in-progress: true

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Espera 30s para debouncear pushes rapidos
        run: |
          echo "Esperando 30s — si llega otro push, este job se cancela y solo sobrevive el ultimo."
          sleep 30
      - name: Dispara Deploy Hook de Vercel
        run: |
          curl -fsS -X POST \
            "https://api.vercel.com/v1/integrations/deploy/prj_ndPuzCC2z2MbtJAw77Rfdmjs6ekq/uTbFKXPUPM" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}'
          echo "✓ Deploy Hook disparado. Vercel construira con el commit mas reciente de main."
