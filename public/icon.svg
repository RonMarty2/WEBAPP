<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Laboratorio Académico">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#141428"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <radialGradient id="aura" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura2" cx="75%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flask" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="liquid" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Fondo cuadrado redondeado -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#aura)"/>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#aura2)"/>

  <!-- Matraz Erlenmeyer (símbolo del laboratorio) -->
  <g transform="translate(256 270)">
    <!-- Cuello del matraz -->
    <rect x="-28" y="-110" width="56" height="50" rx="6" fill="none" stroke="url(#flask)" stroke-width="10"/>
    <!-- Cuerpo del matraz (triangular) -->
    <path d="M -28 -60 L -110 70 Q -118 88 -100 88 L 100 88 Q 118 88 110 70 L 28 -60 Z"
          fill="none" stroke="url(#flask)" stroke-width="10" stroke-linejoin="round"/>
    <!-- Líquido dentro del matraz -->
    <path d="M -78 10 L -100 70 Q -108 82 -94 82 L 94 82 Q 108 82 100 70 L 78 10 Q 0 30 -78 10 Z"
          fill="url(#liquid)" opacity="0.9"/>
    <!-- Burbujas del líquido -->
    <circle cx="-30" cy="40" r="6" fill="#fef3c7" opacity="0.85"/>
    <circle cx="20" cy="55" r="4" fill="#fef3c7" opacity="0.7"/>
    <circle cx="45" cy="30" r="5" fill="#fef3c7" opacity="0.8"/>
  </g>

  <!-- Sparkles de IA alrededor -->
  <g fill="#fef3c7">
    <path d="M 130 130 L 138 146 L 154 154 L 138 162 L 130 178 L 122 162 L 106 154 L 122 146 Z" opacity="0.95"/>
    <path d="M 400 150 L 405 161 L 416 166 L 405 171 L 400 182 L 395 171 L 384 166 L 395 161 Z" opacity="0.85"/>
    <path d="M 420 380 L 425 391 L 436 396 L 425 401 L 420 412 L 415 401 L 404 396 L 415 391 Z" opacity="0.8"/>
  </g>

  <!-- Texto LA abajo -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="800"
        font-size="56" fill="#fef3c7" text-anchor="middle" letter-spacing="6">LAB</text>
</svg>
